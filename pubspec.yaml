name: adrian_tv
description: "ADRIAN TV - Premium streaming application for Live TV, Movies, and Series"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Video Playback (cross-platform via libmpv/FFmpeg)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Networking
  dio: ^5.7.0
  http: ^1.2.2

  # Local Database (SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # XML Parsing (XMLTV EPG)
  xml: ^6.5.0

  # Images
  cached_network_image: ^3.4.1

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.4
  logger: ^2.5.0
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  archive: ^4.0.4
  string_similarity: ^2.0.0
  fuzzywuzzy: ^1.1.6
  connectivity_plus: ^6.1.2
  wakelock_plus: ^1.2.10
  url_launcher: ^6.3.1
  flutter_secure_storage: ^10.3.4

  # UI
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  palette_generator: ^0.3.3+7
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  drift_dev: ^2.22.1
  mockito: ^5.4.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  image_path: "assets/icon/adrian_tv_icon.png"
  adaptive_icon_background: "#0F0E1A"
  adaptive_icon_foreground: "assets/icon/adrian_tv_icon.png"

flutter_native_splash:
  color: "#0A0A12"
  image: assets/branding/splash_mark.png
  branding: assets/branding/wordmark.png
  branding_bottom_padding: 48
  android: true
  ios: true
  android_12:
    color: "#0A0A12"
    image: assets/branding/splash_mark.png
    branding: assets/branding/wordmark.png

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icon/
    - assets/images/
    - assets/demo/

  # Typography is provided at runtime by google_fonts (Inter, OFL-licensed).
  # Bundling Google Sans would be a licence violation, so no fonts are embedded.